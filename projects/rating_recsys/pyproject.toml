[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rating-recsys"
version = "0.1.0"
description = "DB-backed two-stage restaurant recommender"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
experiment = [
    "lightgbm>=4.5,<5",
    "matplotlib>=3.8,<4",
    "mlflow>=3,<4",
    "pandas>=2.2,<3",
    "pyarrow>=18,<26",
    "streamlit>=1.40,<2",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
rating-recsys-migrate = "rating_recsys.db.migrate:main"
rating-recsys-ingest = "rating_recsys.ingestion.cli:main"
rating-recsys-dataset = "rating_recsys.datasets.cli:main"
rating-recsys-experiment = "rating_recsys.experiments.cli:main"
rating-recsys-dashboard = "rating_recsys.observability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
