[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rating-recsys"
version = "0.1.0"
description = "DB-backed two-stage restaurant recommender (candidate retrieval + LambdaRank)"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
experiment = [
    "aiohttp>=3.9,<4",
    "tokenizers>=0.21,<0.23",
    "lightgbm>=4.5,<5",
    "matplotlib>=3.8,<4",
    "mlflow>=3,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.11,<2",
    "streamlit>=1.40,<2",
    "threadpoolctl>=3,<4",
]
# DeepCoNN and the RLMRec alignment projector. CPU wheels:
# pip install -e '.[deepconn]' --extra-index-url https://download.pytorch.org/whl/cpu
deepconn = [
    "torch==2.5.1",
]
# Frozen E5 CPU inference; install with the CPU wheel index used above.
local-embeddings = [
    "torch==2.5.1",
    "transformers==4.56.2",
    "sentence-transformers==5.1.1",
    "tokenizers>=0.21,<0.23",
]
# Local Korean lexical retrieval (rating-recsys-compare bm25).
bm25 = [
    "bm25s==0.2.14",
    "kiwipiepy==0.24.0",
    "kiwipiepy_model==0.24.0",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
rating-recsys-migrate = "rating_recsys.db.migrate:main"
rating-recsys-ingest = "rating_recsys.ingestion.cli:main"
rating-recsys-dataset = "rating_recsys.datasets.cli:main"
rating-recsys-experiment = "rating_recsys.experiments.cli:console_main"
rating-recsys-compare = "rating_recsys.experiments.compare_cli:console_main"
rating-recsys-review-embeddings = "rating_recsys.experiments.review_embedding_cli:console_main"
rating-recsys-dashboard = "rating_recsys.observability.cli:main"
rating-recsys-prepare = "rating_recsys.experiments.prepared:main"
rating-recsys-review-transformer = "rating_recsys.experiments.review_transformer_cli:console_main"
rating-recsys-rlmrec = "rating_recsys.experiments.rlmrec_cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
